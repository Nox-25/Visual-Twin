<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VisualTwin - Zero-Shot PCB Defect Detection</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
            color: #333;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
        }
        h1 {
            color: #2c3e50;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-bottom: 20px;
        }
        button:hover {
            background-color: #2980b9;
        }
        button:disabled {
            background-color: #95a5a6;
            cursor: not-allowed;
        }
        .results {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
        }
        .image-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        .image-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .image-box img {
            max-width: 100%;
            height: auto;
            max-height: 400px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .stats {
            margin-top: 30px;
            padding: 20px;
            background: #ecf0f1;
            border-radius: 8px;
            width: 80%;
            font-size: 1.2em;
        }
        .verdict {
            font-weight: bold;
            font-size: 1.5em;
        }
        .pass {
            color: #27ae60;
        }
        .fail {
            color: #c0392b;
        }
        #loading {
            display: none;
            margin-top: 20px;
            font-weight: bold;
            color: #e67e22;
        }
        .error {
            color: red;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>VisualTwin PCB Inspector</h1>
    <p>Place the PCB ~30-40cm from the Logitech C270 camera. Ensure steady lighting.</p>

    <button id="captureBtn" onclick="captureImage()">Capture from Webcam & Inspect</button>
    <div id="loading">Capturing and analyzing... Please wait.</div>
    <div id="errorMsg" class="error"></div>

    <div id="results" class="results" style="display: none;">
        <div class="stats">
            <div>Anomaly Score: <span id="scoreVal"></span></div>
            <div>Verdict: <span id="verdictVal" class="verdict"></span></div>
        </div>

        <div class="image-container" style="margin-top: 20px;">
            <div class="image-box">
                <h3>Original Capture</h3>
                <img id="origImg" src="" alt="Original Capture">
            </div>
            <div class="image-box">
                <h3>Defect Heatmap Overlay</h3>
                <img id="heatImg" src="" alt="Heatmap Overlay">
            </div>
        </div>
    </div>
</div>

<script>
    async function captureImage() {
        const btn = document.getElementById('captureBtn');
        const loading = document.getElementById('loading');
        const results = document.getElementById('results');
        const errorMsg = document.getElementById('errorMsg');

        btn.disabled = true;
        loading.style.display = 'block';
        results.style.display = 'none';
        errorMsg.innerText = '';

        try {
            const response = await fetch('/capture', { method: 'POST' });
            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error || 'Server error occurred');
            }

            // Populate data
            document.getElementById('origImg').src = 'data:image/jpeg;base64,' + data.original;
            document.getElementById('heatImg').src = 'data:image/jpeg;base64,' + data.heatmap_overlay;

            document.getElementById('scoreVal').innerText = data.score.toFixed(4);
            const verdictSpan = document.getElementById('verdictVal');
            verdictSpan.innerText = data.verdict;

            if (data.verdict === 'PASS') {
                verdictSpan.className = 'verdict pass';
            } else {
                verdictSpan.className = 'verdict fail';
            }

            results.style.display = 'flex';
        } catch (err) {
            errorMsg.innerText = err.message;
        } finally {
            btn.disabled = false;
            loading.style.display = 'none';
        }
    }
</script>

</body>
</html>
